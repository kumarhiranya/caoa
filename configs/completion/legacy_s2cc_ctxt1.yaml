# Legacy CAPCM run ODGNet/experiments/UpTrans_comp/S2CCompletion/s2ccompletion_upTransb1_comp (Table 2 "+Ctxt_100").
# Context input = approved fix 4 (mirrors pose-time inference); the flag values are decided empirically in P6.
name: legacy_s2cc_ctxt1
seed: 2023
num_workers: 8
model: {NAME: UpTrans, in_channels: 4, num_pred: 8192, num_seeds: 1024, seed_fea: 128, dim_feat: 512, num_dicts: 512, upscales: [1, 2, 4], l2_loss: 0}
dataset:
  train: {NAME: S2CCompletion, phase: train, num_points: 4096, rotate_z: true, context_radius: 1.0, context_flag: [1.0, -1.0]}
  val:   {NAME: S2CCompletion, phase: val,   num_points: 4096, rotate_z: true, context_radius: 1.0, context_flag: [1.0, -1.0]}
  test:  {NAME: S2CCompletion, phase: val,   num_points: 4096, rotate_z: true, context_radius: 1.0, context_flag: [1.0, -1.0]}  # legacy: val == test
total_bs: 32
max_epoch: 400
val_freq: 10  # legacy CLI default
consider_metric: CDL1
optimizer: {type: AdamW, kwargs: {lr: 0.0005, weight_decay: 0.0005}}
scheduler: {type: LambdaLR, kwargs: {decay_step: 20, lr_decay: 0.8, lowest_decay: 0.01}}
bnmscheduler: {type: Lambda, kwargs: {decay_step: 20, bn_decay: 0.5, bn_momentum: 0.9, lowest_decay: 0.01}}
loss: {orth_weight: 1.0}
