# P10 ablation re-run on the release inputs (user, 2026-11-06: "re-run the ablations after comparison"): as
# configs/pose/paperschedule_chamfer_siamunshared_world_comp_concat_only_emb1024.yaml, with completions from our concat CAPCM (`ours_concat`) and, where the model uses SEM, our
# recalibrated SEM's embeddings (`ours_sem_cad_bbox`). Generated; the original's notes follow.
# P10d: P10c (separate trunks + t2/r3/s2 + 5 x Chamfer) + the paper's schedule: AdamW wd 1e-4, 150 epochs (15,750 steps),
# cosine to 1e-6. Last step of the P10 ablation (user, 2026-10-28; run as planned, user 2026-11-03).
name: ours_paperschedule_chamfer_siamunshared_world_comp_concat_only_emb1024
seed: 777

model:
  embedding: 1024
  siamese: {shared: false}
  sym_embedding: {name: ours_sem_cad_bbox, frame: cad_bbox, checkpoint: outputs/sem_cad_bbox/model_recalibrated.pth}

data:
  class_rule: relpose_cache  # the rule that built the reported legacy datasets (1,864 test samples)
  completion: {name: ours_concat, mode: only, frame: world, checkpoint: outputs/legacy_concat}
  num_points: 8192
  voxel_size: 0.01
  rot_range_deg: [-180, 180]
  scale_range: [0.4, 1.4]
  scale_aspect_range: [0.0, 0.0]
  trans_range: [-0.5, 0.5]

train:
  batch_size: 64
  max_steps: 15750  # paper: 150 epochs x 105 steps (6,663 pairs, batch 64; the loop finishes the last epoch, as legacy)
  lr: 1.0e-4
  weight_decay: 1.0e-4  # paper (AdamW)
  min_lr_ratio: 0.01  # cosine to 1e-6 = the paper's minimum
  loss_weights: {t: 2, r: 3, s: 2}  # paper (P10c)
  chamfer_weight: 5  # paper: 5 x CD(CAD at predicted box, CAD at GT box), caoa/models/pose_losses.py (user, option 1)
  shuffle: false  # the legacy DataLoader did not shuffle
  num_workers: 8
  stat_freq: 150
  save_freq: 1000
  val_freq: 1000
