# P10 ablation re-run on the release inputs (user, 2026-11-06: "re-run the ablations after comparison"): as
# configs/pose/semcad_world_comp_concat_only_emb1024.yaml, with completions from our concat CAPCM (`ours_concat`) and, where the model uses SEM, our
# recalibrated SEM's embeddings (`ours_sem_cad_bbox`). Generated; the original's notes follow.
# P10a: legacy "mnkpv3_emb" (OCAM + the SEM symmetry embedding of the GT CAD, concatenated after pooling; no legacy run
# used it). Otherwise as world_comp_concat_only_emb1024.yaml. Embeddings: the fix `cad_bbox` (user, 2026-10-28;
# scripts/build_sem_embeddings.py), not the legacy export, which predicts every CAD as not symmetric (docs/results/P9.md).
name: ours_semcad_world_comp_concat_only_emb1024_seed778
seed: 778

model:
  embedding: 1024
  sym_embedding: {name: ours_sem_cad_bbox, frame: cad_bbox, checkpoint: outputs/sem_cad_bbox/model_recalibrated.pth}

data:
  class_rule: relpose_cache  # the rule that built the reported legacy datasets (1,864 test samples)
  completion: {name: ours_concat, mode: only, frame: world, checkpoint: outputs/legacy_concat}
  num_points: 8192
  voxel_size: 0.01
  rot_range_deg: [-180, 180]
  scale_range: [0.4, 1.4]
  scale_aspect_range: [0.0, 0.0]
  trans_range: [-0.5, 0.5]

train:
  batch_size: 64
  max_steps: 25000  # the loop still finishes the epoch in which this is reached, as legacy did
  lr: 1.0e-4
  weight_decay: 1.0e-3  # AdamW
  min_lr_ratio: 0.01  # cosine annealing down to lr / 100 (T_max = max_steps)
  loss_weights: {t: 2, r: 1, s: 2}  # L1, summed over components, averaged over the batch
  shuffle: false  # the legacy DataLoader did not shuffle
  num_workers: 8
  stat_freq: 150
  save_freq: 1000
  val_freq: 1000
