# Leak-free fix (P8, user-approved 2026-10-27): as legacy_comp_concat_only_emb1024.yaml, but the completions come from the CAPCM run in the
# world frame (completion_frame: world; cache odg_concat_snaug_s2cc_upTransb_comp__world), so no GT pose reaches them.
# Legacy OCAM run with completion (P8): paper's final setup (concat completions); no saved run, compare with Table 1.
# Mirrors the server run pose_mnk/S2Cpose_emb1024_vox1cm_wd1e-03_b64_lr1e-04_mnkpv3_rotmat_t2q1s2_adam_cosineannealing
# (legacy val total 71.8% best / 71.2% last logged on the full data, legacy metric).
name: world_comp_concat_only_emb1024
seed: 777

model:
  embedding: 1024

data:
  class_rule: relpose_cache  # the rule that built the reported legacy datasets (1,864 test samples)
  completion: {name: odg_concat_snaug_s2cc_upTransb_comp, mode: only, frame: world}  # scripts/build_pose_completions.py
  num_points: 8192
  voxel_size: 0.01
  rot_range_deg: [-180, 180]
  scale_range: [0.4, 1.4]
  scale_aspect_range: [0.0, 0.0]
  trans_range: [-0.5, 0.5]

train:
  batch_size: 64
  max_steps: 25000  # the loop still finishes the epoch in which this is reached, as legacy did
  lr: 1.0e-4
  weight_decay: 1.0e-3  # AdamW
  min_lr_ratio: 0.01  # cosine annealing down to lr / 100 (T_max = max_steps)
  loss_weights: {t: 2, r: 1, s: 2}  # L1, summed over components, averaged over the batch
  shuffle: false  # the legacy DataLoader did not shuffle
  num_workers: 8
  stat_freq: 150
  save_freq: 1000
  val_freq: 1000
