# P12 reseed (user, 2026-11-04): configs/pose/paperschedule_chamfer_siamunshared_world_comp_concat_only_emb1024.yaml with seed 778 (original: 777).
# P10d: P10c (separate trunks + t2/r3/s2 + 5 x Chamfer) + the paper's schedule: AdamW wd 1e-4, 150 epochs (15,750 steps),
# cosine to 1e-6. Last step of the P10 ablation (user, 2026-10-28; run as planned, user 2026-11-03).
name: paperschedule_chamfer_siamunshared_world_comp_concat_only_emb1024_seed778
seed: 778

model:
  embedding: 1024
  siamese: {shared: false}
  sym_embedding: {name: S2Csym_emb128_bce_vox1cm_wd1e-03_b64_lr1e-04_bbcls-ptv3-v1m1-0-shapenet_v2_mini_ptv3cls_softmax_symbinary_cad_bce_adam_cosineannealing, frame: cad_bbox}

data:
  class_rule: relpose_cache  # the rule that built the reported legacy datasets (1,864 test samples)
  completion: {name: odg_concat_snaug_s2cc_upTransb_comp, mode: only, frame: world}  # scripts/build_pose_completions.py
  num_points: 8192
  voxel_size: 0.01
  rot_range_deg: [-180, 180]
  scale_range: [0.4, 1.4]
  scale_aspect_range: [0.0, 0.0]
  trans_range: [-0.5, 0.5]

train:
  batch_size: 64
  max_steps: 15750  # paper: 150 epochs x 105 steps (6,663 pairs, batch 64; the loop finishes the last epoch, as legacy)
  lr: 1.0e-4
  weight_decay: 1.0e-4  # paper (AdamW)
  min_lr_ratio: 0.01  # cosine to 1e-6 = the paper's minimum
  loss_weights: {t: 2, r: 3, s: 2}  # paper (P10c)
  chamfer_weight: 5  # paper: 5 x CD(CAD at predicted box, CAD at GT box), caoa/models/pose_losses.py (user, option 1)
  shuffle: false  # the legacy DataLoader did not shuffle
  num_workers: 8
  stat_freq: 150
  save_freq: 1000
  val_freq: 1000
