# P12 reseed (user, 2026-11-04): configs/pose/siamshared_world_comp_concat_only_emb1024.yaml with seed 778 (original: 777).
# P10b (paper): Siamese OCAM with ONE trunk shared by the object and the CAD (user, 2026-10-28). The CAD enters in its
# own bounding-box frame (scripts/build_cad_points.py) and the target is the box, as OCAM. Heads: legacy RelPose's.
# Otherwise as semcad_world_comp_concat_only_emb1024.yaml (P10a: SEM cad_bbox, leak-free concat completion-only, legacy schedule).
name: siamshared_world_comp_concat_only_emb1024_seed778
seed: 778

model:
  embedding: 1024
  siamese: {shared: true}
  sym_embedding: {name: S2Csym_emb128_bce_vox1cm_wd1e-03_b64_lr1e-04_bbcls-ptv3-v1m1-0-shapenet_v2_mini_ptv3cls_softmax_symbinary_cad_bce_adam_cosineannealing, frame: cad_bbox}

data:
  class_rule: relpose_cache  # the rule that built the reported legacy datasets (1,864 test samples)
  completion: {name: odg_concat_snaug_s2cc_upTransb_comp, mode: only, frame: world}  # scripts/build_pose_completions.py
  num_points: 8192
  voxel_size: 0.01
  rot_range_deg: [-180, 180]
  scale_range: [0.4, 1.4]
  scale_aspect_range: [0.0, 0.0]
  trans_range: [-0.5, 0.5]

train:
  batch_size: 64
  max_steps: 25000  # the loop still finishes the epoch in which this is reached, as legacy did
  lr: 1.0e-4
  weight_decay: 1.0e-3  # AdamW
  min_lr_ratio: 0.01  # cosine annealing down to lr / 100 (T_max = max_steps)
  loss_weights: {t: 2, r: 1, s: 2}  # L1, summed over components, averaged over the batch
  shuffle: false  # the legacy DataLoader did not shuffle
  num_workers: 8
  stat_freq: 150
  save_freq: 1000
  val_freq: 1000
