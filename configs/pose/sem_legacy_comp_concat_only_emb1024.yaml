# P10a: legacy "mnkpv3_emb" (OCAM + the SEM symmetry embedding of the GT CAD, concatenated after pooling; no legacy run
# used it). Otherwise as legacy_comp_concat_only_emb1024.yaml. Embeddings: legacy data/s2c_symmetry/<sym_embedding>/embeddings.npy.
name: sem_legacy_comp_concat_only_emb1024
seed: 777

model:
  embedding: 1024
  sym_embedding: S2Csym_emb128_bce_vox1cm_wd1e-03_b64_lr1e-04_bbcls-ptv3-v1m1-0-shapenet_v2_mini_ptv3cls_softmax_symbinary_cad_bce_adam_cosineannealing  # legacy symmetry_model_name

data:
  class_rule: relpose_cache  # the rule that built the reported legacy datasets (1,864 test samples)
  completion: {name: odg_concat_snaug_s2cc_upTransb_comp, mode: only}  # scripts/build_pose_completions.py
  num_points: 8192
  voxel_size: 0.01
  rot_range_deg: [-180, 180]
  scale_range: [0.4, 1.4]
  scale_aspect_range: [0.0, 0.0]
  trans_range: [-0.5, 0.5]

train:
  batch_size: 64
  max_steps: 25000  # the loop still finishes the epoch in which this is reached, as legacy did
  lr: 1.0e-4
  weight_decay: 1.0e-3  # AdamW
  min_lr_ratio: 0.01  # cosine annealing down to lr / 100 (T_max = max_steps)
  loss_weights: {t: 2, r: 1, s: 2}  # L1, summed over components, averaged over the batch
  shuffle: false  # the legacy DataLoader did not shuffle
  num_workers: 8
  stat_freq: 150
  save_freq: 1000
  val_freq: 1000
