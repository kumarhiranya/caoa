# Data locations. Copy to configs/paths.local.yaml (git-ignored) to override
# per machine, or point CAOA_PATHS at another file.

# Extracted ScanNet v2 scenes: <scannet_scans>/<scene_id>/<scene_id>_vh_clean_2.ply etc.
scannet_scans: /home/data/datasets/ScanNet_v2/dataset/scans

# ShapeNetCore v2 (models/model_normalized.obj per CAD model). Local partial mirror of the
# external drive's "3D Datasets/ShapeNetV2": only the CAD .obj files the pipeline uses (S2C and
# SN-Indoor), the SN-Indoor partials in the sibling ShapeNetV2-augmented/, and the split files.
shapenet: /home/data/datasets/ShapeNetV2_caoa/ShapeNetV2

# Scan2CAD annotations with the S2C-Completion `scannet_instance_id` field
s2c_annotations: /home/hiranya/research/Github/vr_reconstruction/scan2cad_annotator/scan2cad_v2_completion_annotations.json

# Official Scan2CAD benchmark inputs (Scan2CAD/dataset in the Scan2CAD repo)
scan2cad_full_annotations: /home/hiranya/research/Github/vr_reconstruction/Scan2CAD/dataset/full_annotations.json
scan2cad_cad_appearances: /home/hiranya/research/Github/vr_reconstruction/Scan2CAD/dataset/cad_appearances.json

# The legacy codebase (read-only reference; used by parity tests)
legacy_repo: /home/hiranya/research/Github/vr_reconstruction

# Legacy SEM (PTv3 classifier) CAD embeddings, {catid_idcad: (512,)}; the completion datasets
# return them as `sem_emb` (zeros for CADs missing from the file, fix 3). 46 MB.
semantic_embeddings: /home/hiranya/research/Github/vr_reconstruction/data/ShapeNetSemantic/classification_ptv3/semantic_embeddings.npy

# Legacy target tables (the server's results/ folder: comp.csv, compinst.csv, sg_mnk_comp.csv,
# perclass_results.csv, ODG_*_S2CC.csv, ...). 49 KB.
legacy_results: /media/hiranya/KHG Elements/mmlab-server-data/data/hiranya/Github/vr_reconstruction/results

# Derived data written by this codebase
cache: cache
