# Data locations. Copy to configs/paths.local.yaml (git-ignored) and edit, or point CAOA_PATHS at another file.
# Relative paths are relative to the repository root.

# ScanNet v2 scans: <scannet_scans>/<scene_id>/<scene_id>_vh_clean_2.ply, ..._vh_clean_2.0.010000.segs.json, ...aggregation.json
scannet_scans: data/scannet/scans

# ShapeNetCore v2 (<synset>/<model>/models/model_normalized.obj), with the SN-Indoor partials in the sibling
# ShapeNetV2-augmented/ and its file list aug_train_test_splits.pkl in this folder.
shapenet: data/ShapeNetV2

# Scan2CAD-Completion (S2C-C) annotations: Scan2CAD alignments with the matching ScanNet instance id per object,
# and the CAD train / val split used by the SEM.
s2c_annotations: data/s2cc/scan2cad_v2_completion_annotations.json
s2c_cad_splits: data/s2cc/s2c_cad_splits.pkl

# Official Scan2CAD benchmark inputs (Scan2CAD/dataset in the Scan2CAD repository)
scan2cad_full_annotations: data/scan2cad/full_annotations.json
scan2cad_cad_appearances: data/scan2cad/cad_appearances.json

# Per-CAD semantic embeddings {catid_idcad: (512,)}, the CAPCM's semantic input (zeros for CADs not in the file)
semantic_embeddings: data/s2cc/semantic_embeddings.npy

# Instance predictions on the ScanNet val scans, one <scene>_sg_preds.npz per scene (caoa.data.softgroup)
softgroup_preds: data/instances/softgroup/val
sphericalmask_preds: data/instances/sphericalmask/val

# Derived data written by this codebase
cache: cache
