[project]
name = "caoa"
version = "0.1.0"
description = "Clean re-implementation of CAOA: Completion-Assisted Object-CAD Alignment (arXiv 2606.18429)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "plyfile>=1.0",
    "trimesh>=4.4",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # Only used by tests/legacy_ref.py to run verbatim copies of the legacy code.
    "numpy-quaternion>=2024.0",
    "scikit-learn>=1.5",  # legacy eval_pose_s2c_v2 / eval_sym use sklearn.metrics
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["caoa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: needs the ScanNet / Scan2CAD data on this machine"]

[project.optional-dependencies]
train = [
    "torch==2.9.1",
    "spconv-cu126==2.3.8",
    "tensorboard>=2.18",
    "addict>=2.4",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
